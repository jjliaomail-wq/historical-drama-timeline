<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片資料填入工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }
        h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            background: linear-gradient(to right, #f8fafc, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }
        .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        .card {
            background: rgba(30,41,59,0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 680px;
            backdrop-filter: blur(12px);
            margin-bottom: 1.2rem;
        }
        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
            padding-bottom: 0.5rem;
        }
        label {
            display: block;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        input, textarea {
            width: 100%;
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: #f8fafc;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 1rem;
        }
        input:focus, textarea:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
        }
        input[readonly] { opacity: 0.5; cursor: default; }
        textarea { resize: vertical; min-height: 90px; }
        .row { display: flex; gap: 0.8rem; }
        .row > div { flex: 1; }
        button {
            width: 100%;
            padding: 0.95rem;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-main {
            background: linear-gradient(135deg, #d4af37, #b8952e);
            color: #0f172a;
            margin-bottom: 0;
        }
        .btn-main:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212,175,55,0.3); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-copy {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
        }
        .btn-copy:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(59,130,246,0.3); }
        .btn-copy:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
        .status {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 1rem;
            display: none;
        }
        .status.show { display: block; }
        .status.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: #86efac; }
        .status.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
        .status.info { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: #93c5fd; }
        .preview-box {
            background: rgba(212,175,55,0.04);
            border: 1px dashed rgba(212,175,55,0.25);
            border-radius: 10px;
            padding: 0.9rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            word-break: break-all;
            margin-bottom: 1rem;
            min-height: 55px;
            white-space: pre-wrap;
        }
        .api-notice {
            background: rgba(212,175,55,0.06);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            line-height: 1.7;
        }
        .api-notice a { color: #d4af37; font-weight: 600; }
        .api-notice code {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
            font-size: 0.82rem;
            color: #fcd34d;
        }
        .saved-badge {
            font-size: 0.75rem;
            background: rgba(34,197,94,0.15);
            color: #86efac;
            border: 1px solid rgba(34,197,94,0.25);
            border-radius: 6px;
            padding: 0.15rem 0.6rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>📺 歷史劇資料填入工具</h1>
    <p class="subtitle">貼入 YouTube 連結，一鍵自動產生所有欄位資料</p>

    <!-- Gemini API Key 設定 -->
    <div class="card">
        <div class="section-title">⚙️ 一次性設定 — Gemini API Key</div>
        <div class="api-notice">
            需要免費的 Gemini API Key 才能自動產生描述。<br>
            👉 前往 <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>，登入後點「Create API Key」，複製貼入下方。<br>
            Key 會記在瀏覽器裡，下次不需要重填。
        </div>
        <label>Gemini API Key <span id="keyBadge" class="saved-badge" style="display:none">已儲存</span></label>
        <div style="display:flex; gap:0.6rem; margin-bottom:0">
            <input type="password" id="geminiKey" placeholder="AIzaSy..." style="margin-bottom:0; flex:1" />
            <button onclick="saveKey()" style="width:auto; padding:0 1.5rem; border-radius:10px; background:rgba(212,175,55,0.15); color:#d4af37; border:1px solid rgba(212,175,55,0.3); font-weight:600; font-family:Inter,sans-serif; cursor:pointer;">儲存</button>
        </div>
    </div>

    <!-- 主要輸入 -->
    <div class="card">
        <div class="section-title">🎬 貼入影片連結</div>
        <label>YouTube 影片網址</label>
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." />
        <div id="status" class="status"></div>
        <button class="btn-main" id="fetchBtn" onclick="fetchAll()">⚡ 自動產生所有資料</button>
    </div>

    <!-- 結果 -->
    <div class="card">
        <div class="section-title">✅ 產生的欄位（可修改）</div>
        <div class="row">
            <div>
                <label>A 欄 — era（朝代）</label>
                <input type="text" id="era" placeholder="自動偵測" />
            </div>
            <div>
                <label>B 欄 — period（年份）</label>
                <input type="text" id="period" placeholder="自動偵測" />
            </div>
        </div>
        <label>C 欄 — title（劇名）</label>
        <input type="text" id="title" placeholder="自動抓取" />
        <label>D 欄 — description（AI 生成約 50 字介紹）</label>
        <textarea id="description" placeholder="AI 自動生成，也可以手動修改..."></textarea>
        <label>E 欄 — youtubeUrl</label>
        <input type="text" id="finalUrl" placeholder="自動帶入" readonly />

        <div class="section-title" style="margin-top:0.5rem">複製到試算表</div>
        <div class="preview-box" id="preview">資料產生後會顯示在這裡...</div>
        <button class="btn-copy" id="copyBtn" onclick="copyRow()" disabled>📋 複製整列 → 貼到試算表 A 欄</button>
    </div>

    <script>
    // --- 朝代偵測 ---
    const dynastyMap = [
        { kw:['夏','商','周','春秋','戰國','先秦','大秦','孫子','伍子胥','管仲','百里奚','范蠡','越王','孫臏','長平'], era:'先秦時期', period:'西元前 2070年 - 前 221年' },
        { kw:['楚漢','項羽','劉邦','鴻門宴','垓下'], era:'秦漢之際', period:'西元前 209年 - 前 202年' },
        { kw:['漢朝','漢武帝','衛青','霍去病','昭君','東漢','西漢','劉徹','大漢','漢代'], era:'漢朝', period:'西元前 202年 - 220年' },
        { kw:['三國','曹操','諸葛亮','司馬懿','孫權','劉備','赤壁','荊州','蜀漢','曹魏','東吳','軍師聯盟','虎嘯龍吟'], era:'三國時期', period:'西元 220年 - 280年' },
        { kw:['晉朝','南北朝','蘭陵王','琅琊榜','花木蘭','魏晉'], era:'魏晉南北朝', period:'西元 220年 - 589年' },
        { kw:['隋朝','大業','煬帝','大隋'], era:'隋朝', period:'西元 581年 - 618年' },
        { kw:['唐朝','長安','玄宗','武則天','楊貴妃','李世民','貞觀','開元','天寶','大明宮','霓裳','長歌行','十二時辰','大唐','唐代','上陽賦'], era:'唐朝', period:'西元 618年 - 907年' },
        { kw:['宋朝','知否','明蘭','清平樂','徽宗','岳飛','靖康','開封','大宋','宋代'], era:'宋朝', period:'西元 960年 - 1279年' },
        { kw:['元朝','忽必烈','成吉思汗','蒙古','大元'], era:'元朝', period:'西元 1271年 - 1368年' },
        { kw:['明朝','明代','朱元璋','永樂','嘉靖','萬曆','崇禎','大明','鄭和','海瑞','張居正','風華'], era:'明朝', period:'西元 1368年 - 1644年' },
        { kw:['清朝','清代','努爾哈赤','皇太極','康熙','雍正','乾隆','甄嬛','延禧','如懿','步步驚心','宮鎖','紫禁城','大清','嘉慶'], era:'清朝', period:'西元 1636年 - 1912年' },
        { kw:['民國','辛亥','抗戰','1912','新文化','五四'], era:'民國時期', period:'西元 1912年 - 1949年' },
    ];

    function detectDynasty(title) {
        for (const d of dynastyMap) {
            for (const kw of d.kw) {
                if (title.includes(kw)) return { era: d.era, period: d.period };
            }
        }
        return null;
    }

    function extractVideoId(url) {
        const m = url.match(/(?:youtu\.be\/|watch\?v=|embed\/)([^#&?]{11})/);
        return m ? m[1] : null;
    }

    function showStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = `status show ${type}`;
    }

    function saveKey() {
        const key = document.getElementById('geminiKey').value.trim();
        if (!key) return;
        localStorage.setItem('geminiKey', key);
        document.getElementById('keyBadge').style.display = 'inline';
        showStatus('✅ API Key 已儲存！', 'success');
    }

    function loadKey() {
        const saved = localStorage.getItem('geminiKey');
        if (saved) {
            document.getElementById('geminiKey').value = saved;
            document.getElementById('keyBadge').style.display = 'inline';
        }
    }

    async function generateDescription(dramaTitle, apiKey) {
        const prompt = `請用繁體中文，在50字以內簡短介紹歷史劇《${dramaTitle}》的主要劇情與特色。只需要純文字，不要加標題或任何符號。`;
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { maxOutputTokens: 150 }
                })
            }
        );
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || 'Gemini API 錯誤');
        }
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    }

    async function fetchAll() {
        const url = document.getElementById('ytUrl').value.trim();
        const apiKey = document.getElementById('geminiKey').value.trim() || localStorage.getItem('geminiKey');

        if (!url) { showStatus('請先貼上 YouTube 連結！', 'error'); return; }

        const videoId = extractVideoId(url);
        if (!videoId) { showStatus('無法識別此連結格式，請確認是否為正確的 YouTube 網址。', 'error'); return; }

        document.getElementById('fetchBtn').disabled = true;
        showStatus('⏳ 第 1 步：抓取影片標題...', 'info');

        const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;
        document.getElementById('finalUrl').value = cleanUrl;

        try {
            // Step 1: 抓標題
            const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(cleanUrl)}&format=json`);
            if (!res.ok) throw new Error('無法抓取影片標題');
            const data = await res.json();
            const title = data.title;
            document.getElementById('title').value = title;

            // Step 2: 偵測朝代
            const dynasty = detectDynasty(title);
            if (dynasty) {
                document.getElementById('era').value = dynasty.era;
                document.getElementById('period').value = dynasty.period;
            }

            // Step 3: AI 生成描述
            if (apiKey) {
                showStatus('⏳ 第 2 步：AI 自動生成介紹中...', 'info');
                try {
                    // 用劇名（去掉 YouTube 頻道名稱後綴）來問 AI
                    const cleanTitle = title.split(/[|｜\-–—]/)[0].trim();
                    const desc = await generateDescription(cleanTitle, apiKey);
                    document.getElementById('description').value = desc;
                    showStatus(`✅ 完成！${dynasty ? '朝代：' + dynasty.era + '，' : ''}描述已自動生成。可以直接複製了！`, 'success');
                } catch (aiErr) {
                    showStatus(`⚠️ 標題已抓到，但 AI 生成失敗（${aiErr.message}）。請手動填寫描述。`, 'error');
                }
            } else {
                showStatus(`✅ 標題已抓取。請先儲存 Gemini API Key 以自動生成描述，或手動填寫。`, 'success');
            }

            updatePreview();
            document.getElementById('copyBtn').disabled = false;
        } catch (err) {
            showStatus(`❌ 失敗：${err.message}`, 'error');
        } finally {
            document.getElementById('fetchBtn').disabled = false;
        }
    }

    function updatePreview() {
        const era = document.getElementById('era').value;
        const period = document.getElementById('period').value;
        const title = document.getElementById('title').value;
        const desc = document.getElementById('description').value;
        const url = document.getElementById('finalUrl').value;
        document.getElementById('preview').textContent = [era, period, title, desc, url].join('\t');
    }

    function copyRow() {
        updatePreview();
        const text = document.getElementById('preview').textContent;
        navigator.clipboard.writeText(text).then(() => {
            showStatus('✅ 已複製！去 Google 試算表，點選空白的 A 欄，按 Ctrl+V 貼上。', 'success');
        });
    }

    ['era','period','title','description'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
    });

    document.getElementById('ytUrl').addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchAll();
    });

    loadKey();
    </script>
</body>
</html>
